services:
  - type: worker
    name: quotex-ai-bot
    runtime: docker
    plan: starter  # $7/month minimum for workers
    envVars:
      - key: ALPACA_API_KEY
        sync: false  # Set in Render dashboard
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: ASSET
        value: "BTC/USD,ETH/USD,SOL/USD,AVAX/USD"
      - key: TIMEFRAME
        value: "15"
      - key: AMOUNT
        value: "10.0"
      - key: MIN_CONFIDENCE
        value: "75.0"
      - key: PAPER_TRADING
        value: "false"
      - key: MAX_DAILY_LOSS
        value: "100.0"
      - key: MAX_DAILY_TRADES
        value: "50"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///quotex_ai.db"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SIGNAL_MAX_AGE_MS
        value: "300.0"
      - key: SLIPPAGE_MAX_PCT
        value: "0.05"
      - key: NETWORK_TIMEOUT
        value: "45.0"
      - key: TRADE_COOLDOWN_SEC
        value: "3.0"
      - key: SCAN_INTERVAL_SEC
        value: "10.0"
      - key: CANDLE_TIMEOUT_SEC
        value: "20.0"
